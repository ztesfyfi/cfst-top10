services:
  cfst-top10:
    build: .
    image: ghcr.io/ztesfyfi/cfst-top10:dev
    container_name: cfst-top10
    restart: unless-stopped
    init: true
    ports:
      - "${CFST_BIND_ADDRESS:-127.0.0.1}:${CFST_PORT:-8765}:8000"
    environment:
      CFST_DATA_DIR: /data
      CFST_ENGINE_DIR: /opt/cfst
      CFST_ADMIN_TOKEN: ${CFST_ADMIN_TOKEN:?Set CFST_ADMIN_TOKEN in .env}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - cfst_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  cfst_data:
